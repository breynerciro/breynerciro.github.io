<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background: near-black with subtle green border -->
  <rect width="32" height="32" rx="4" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="3.5" stroke="#276749" stroke-width="1"/>

  <!-- Terminal title bar strip -->
  <rect x="0.5" y="0.5" width="31" height="7" rx="3.5" fill="#0d0d0d"/>
  <rect x="0.5" y="4" width="31" height="4" fill="#0d0d0d"/>

  <!-- macOS traffic dots -->
  <circle cx="5.5" cy="4" r="1.5" fill="#ff5f57"/>
  <circle cx="10"  cy="4" r="1.5" fill="#febc2e"/>
  <circle cx="14.5" cy="4" r="1.5" fill="#28c840"/>

  <!-- Prompt: "> _" centered in body area -->
  <!-- ">" chevron -->
  <path d="M8 15 L12.5 19 L8 23" stroke="#4ade80" stroke-width="2.2"
        stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  <!-- Cursor block -->
  <rect x="15" y="15" width="5" height="8" fill="#4ade80" opacity="0.9"/>
  <!-- Second cursor column for block feel -->
  <rect x="21" y="15" width="4" height="8" fill="#4ade80" opacity="0.25"/>
</svg>
